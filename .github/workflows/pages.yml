name: Deploy · GitHub Pages

# PENDIENTE (no se puede hacer desde el repositorio, es configuración de GitHub):
# activar la protección de la rama `main` — Settings → Branches → Add rule →
# «Require status checks to pass before merging» marcando el check
# «Lint HTML + suite de dominio». Este archivo bloquea la PUBLICACIÓN si la
# verificación falla, pero NO impide que un commit roto llegue a `main`.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Antes «Deploy» salía verde aunque «CI» estuviera rojo: producción se publicaba
  # sin que nadie hubiera pasado el lint, la suite de dominio ni las reglas de
  # Firestore. Ahora la publicación DEPENDE (`needs:`) de esta verificación, que
  # es el MISMO flujo de CI reutilizado — no una copia que se desincronice.
  verificar:
    name: Verificación previa (CI)
    uses: ./.github/workflows/ci.yml

  build-deploy:
    needs: verificar          # si la verificación falla, NO se publica nada
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # El sitio publicaba el repositorio ENTERO (`path: .`), así que carpetas de
      # trabajo quedaban servidas en internet sin sesión. Entre ellas `_dev/`, con
      # nueve informes de ensayos REALES del transformador serie 450108.
      # Aquí se retiran del artefacto ANTES de publicar. No se borran del repo:
      # solo dejan de servirse. Ninguna de estas rutas la necesita el sitio en
      # ejecución — verificado: ninguna página ni módulo de `assets/js/` las carga.
      - name: Retirar del artefacto lo que NO debe publicarse
        run: |
          set -eux
          # `scripts/` NO se retira entero: `assets/js/calculo-refrigeracion.js`
          # importa en caliente `scripts/migrate/tipificar-suministros-fan-db.js`
          # (líneas 244 y 313). Se retira solo lo que nadie carga en ejecución.
          rm -rf _dev _legacy tests functions .github
          find scripts -maxdepth 1 -type f -name '*.mjs' -delete
          rm -f  package.json package-lock.json firebase.json .firebaserc \
                 firestore.rules firestore.indexes.json storage.rules \
                 vercel.json eslint.config.js .html-validate.json
          echo "--- lo que queda publicado ---"
          ls -a

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: deploy
        uses: actions/deploy-pages@v4
