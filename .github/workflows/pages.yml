name: Deploy · GitHub Pages

# PENDIENTE (no se puede hacer desde el repositorio, es configuración de GitHub):
# activar la protección de la rama `main` — Settings → Branches → Add rule →
# «Require status checks to pass before merging» marcando el check
# «Lint HTML + suite de dominio». Este archivo bloquea la PUBLICACIÓN si la
# verificación falla, pero NO impide que un commit roto llegue a `main`.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Antes «Deploy» salía verde aunque «CI» estuviera rojo: producción se publicaba
  # sin que nadie hubiera pasado el lint, la suite de dominio ni las reglas de
  # Firestore. Ahora la publicación DEPENDE (`needs:`) de esta verificación, que
  # es el MISMO flujo de CI reutilizado — no una copia que se desincronice.
  verificar:
    name: Verificación previa (CI)
    uses: ./.github/workflows/ci.yml

  build-deploy:
    needs: verificar          # si la verificación falla, NO se publica nada
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # LISTA DE PERMITIDOS (99 §211). Antes se publicaba el repo entero menos una
      # lista de borrado, y esa lista no cubría el cerebro: `CLAUDE.md`, `.claude/`,
      # `docs/` (análisis de contrato incluido) y `skills/` se servían sin sesión.
      # Ahora el artefacto se arma SOLO con lo que la web carga en ejecución; todo
      # lo nuevo queda fuera por defecto. Para publicar algo más, se añade aquí.
      #   · `docs/pruebas/*.json`: las fichas que `pruebas-electricas-shell.js` pide con fetch.
      #   · `scripts/migrate/tipificar-suministros-fan-db.js`: lo importa en caliente
      #     `assets/js/calculo-refrigeracion.js`.
      - name: Armar el artefacto SOLO con lo que la web necesita
        run: |
          set -eux
          mkdir -p _site/docs _site/scripts/migrate
          cp -R index.html home.html pages admin assets sw.js manifest.json \
                robots.txt sitemap.xml transformador_2048px-2.png .nojekyll _site/
          cp -R docs/pruebas _site/docs/pruebas
          cp scripts/migrate/tipificar-suministros-fan-db.js _site/scripts/migrate/
          echo "--- lo que queda publicado ---"
          find _site -maxdepth 2 | sort

      # Si una página cita un archivo que el repo tiene y la lista dejó fuera, NO se publica.
      - name: Comprobar que al artefacto no le falta nada
        run: node scripts/verificar-artefacto-pages.mjs _site .

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deploy
        uses: actions/deploy-pages@v4
