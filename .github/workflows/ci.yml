name: CI · Lint + Tests

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
      - 'DESARROLLO-/-PROYECTO-MJ'   # G110 (ADR-052 Ola 3): la rama de trabajo real ahora SÍ corre CI
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  # Permite que OTRO flujo llame a esta verificación como paso previo.
  # Lo usa `pages.yml`: la publicación ya no ocurre si esta verificación falla.
  workflow_call:

permissions:
  contents: read

concurrency:
  # El nombre del flujo que INVOCA entra en el grupo: cuando el despliegue llama
  # a esta verificación, no debe cancelar (ni ser cancelada por) la corrida
  # propia de CI sobre la misma rama.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint HTML + suite de dominio
    runs-on: ubuntu-latest
    # Corta cualquier cuelgue del emulador en vez de dejar el runner ocupado horas.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Validar HTML
        run: npm run lint:html

      # G026/G109 (ADR-052 Ola 3): la suite de dominio completa ahora corre en CI.
      # Antes solo se validaba HTML y el deploy salía sin ejecutar la suite.
      - name: Tests unitarios (node --test)
        run: npm run test:unit

      # G025 (ADR-052 Ola 3): firestore.rules —el único firewall del backend—
      # ahora se testea con el emulador de Firestore (requiere Java + firebase-tools).
      # Java 21: `firebase-tools` dejó de aceptar runtimes anteriores. El error
      # exacto que tumbó CI 76 veces seguidas desde el 22 de julio fue:
      #   "firebase-tools no longer supports Java version before 21."
      # (verificado en el log de la corrida 31907520435, paso «Tests de reglas»).
      # En la Mac del Ingeniero pasaba porque allí hay un JDK 25 instalado.
      - name: Setup Java (emulador Firestore)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar firebase-tools
        run: npm install -g firebase-tools --no-audit --no-fund

      - name: Tests de reglas Firestore (emulador)
        run: npm run test:rules
