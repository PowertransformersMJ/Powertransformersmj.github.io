name: CI · Lint + Tests

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
      - 'DESARROLLO-/-PROYECTO-MJ'   # G110 (ADR-052 Ola 3): la rama de trabajo real ahora SÍ corre CI
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  # Permite que OTRO flujo llame a esta verificación como paso previo.
  # Lo usa `pages.yml`: la publicación ya no ocurre si esta verificación falla.
  workflow_call:

permissions:
  contents: read

concurrency:
  # El nombre del flujo que INVOCA entra en el grupo: cuando el despliegue llama
  # a esta verificación, no debe cancelar (ni ser cancelada por) la corrida
  # propia de CI sobre la misma rama.
  # En las ramas que PUBLICAN (main y master, las de pages.yml) ninguna corrida se cancela: la guardia SCADA revisa
  # solo el rango de SU push, y una corrida cancelada dejaba ese rango sin revisar (revisión de K-7, 2026-11-09).
  # Por eso ahí el grupo lleva el número de la corrida (uno por push): con un grupo compartido, GitHub cancela la
  # corrida que espera turno cuando llega otra, aunque cancel-in-progress sea false. En las demás ramas y en los PR
  # se cancela lo viejo, como siempre.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  verificar:
    name: Lint HTML + suite de dominio
    runs-on: ubuntu-latest
    # Corta cualquier cuelgue del emulador en vez de dejar el runner ocupado horas.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      # 🔒 Cero cerebro en el sitio (99 §212; K-7/S7-10): el repo es PÚBLICO. Falla si lo versionado trae
      # `docs/` (salvo las fichas `docs/pruebas/*.json`), `skills/`, `_legacy/`, `.claude/**` (salvo
      # settings.json), un SKILL.md, un nombre propio del cerebro (05-ESTADO-GLOBAL, 10-MEMORIA-CORTO-PLAZO,
      # 99-HISTORIAL-ADR) en cualquier carpeta, o un CLAUDE.md / AGENTS.md / GEMINI.md de más de 2 kB. En CI
      # dice la categoría y cuántos, sin rutas (el log es público). Solo usa node y git: va antes de `npm ci`.
      - name: Cero cerebro en el sitio (rutas y tamaño del puente)
        run: node scripts/guardia-cero-cerebro.mjs --arbol

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Validar HTML
        run: npm run lint:html

      # G026/G109 (ADR-052 Ola 3): la suite de dominio completa ahora corre en CI.
      # Antes solo se validaba HTML y el deploy salía sin ejecutar la suite.
      - name: Tests unitarios (node --test)
        run: npm run test:unit

      # G025 (ADR-052 Ola 3): firestore.rules —el único firewall del backend—
      # ahora se testea con el emulador de Firestore (requiere Java + firebase-tools).
      # Java 21: `firebase-tools` dejó de aceptar runtimes anteriores. El error
      # exacto que tumbó CI 76 veces seguidas desde el 22 de julio fue:
      #   "firebase-tools no longer supports Java version before 21."
      # (verificado en el log de la corrida 31907520435, paso «Tests de reglas»).
      # En la Mac del Ingeniero pasaba porque allí hay un JDK 25 instalado.
      - name: Setup Java (emuladores Firestore + Storage)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar firebase-tools
        run: npm install -g firebase-tools --no-audit --no-fund

      # TODO-46 (cola de ADR-071): storage.rules se desplegó sin una sola
      # prueba —el deploy solo COMPILA las reglas—, así que la promesa
      # «nadie puede descargar la firma de otro» nunca se había demostrado.
      # Desde ahora el mismo paso levanta AMBOS emuladores: las reglas de
      # Storage consultan Firestore (`firestore.exists` sobre /usuarios), y
      # sin el segundo emulador `isTeamMember()` no se puede evaluar.
      - name: Tests de reglas Firestore + Storage (emuladores)
        run: npm run test:rules

  # Guardia de datos SCADA del lado del servidor (S7-07@10-11; K-7 de la auditoría del 2026-11-08).
  # Las de la máquina (pre-commit, commit-msg, pre-push) no ven lo que entra por la web de GitHub
  # («Add files via upload», merges de PR), desde otra máquina sin `core.hooksPath` ni con --no-verify.
  # Revisa el RANGO del push o del PR: mensajes, líneas agregadas y nombres de archivo. Solo usa
  # patrones (no necesita la bóveda ni dependencias). Además mira los NOMBRES de todo el árbol de la punta
  # (el rojo dura mientras el archivo siga ahí, aunque el push siguiente venga limpio), y el contenido del
  # árbol lo revisa tests/scada_carga_guardia.test.js. El freno de publicar NO corre aquí: lee el 99 de la bóveda,
  # que en CI no existe (99 §212). Como `pages.yml` reutiliza este flujo, un rojo aquí frena el deploy.
  guardia-scada:
    name: Guardia de datos SCADA (rango del push o del PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout con historia (el rango necesita el commit anterior y origin/main)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Guardia SCADA sobre los commits nuevos
        run: node scripts/guardia-scada.mjs --ci
