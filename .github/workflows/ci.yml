name: CI · Lint + Tests

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
      - 'DESARROLLO-/-PROYECTO-MJ'   # G110 (ADR-052 Ola 3): la rama de trabajo real ahora SÍ corre CI
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint HTML + 1185 tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Validar HTML
        run: npm run lint:html

      # G026/G109 (ADR-052 Ola 3): los 1185 tests de dominio ahora corren en CI.
      # Antes solo se validaba HTML y el deploy salía sin ejecutar la suite.
      - name: Tests unitarios (node --test)
        run: npm run test:unit
