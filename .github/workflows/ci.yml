name: CI · Lint + Tests

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
      - 'DESARROLLO-/-PROYECTO-MJ'   # G110 (ADR-052 Ola 3): la rama de trabajo real ahora SÍ corre CI
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint HTML + suite de dominio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Validar HTML
        run: npm run lint:html

      # G026/G109 (ADR-052 Ola 3): la suite de dominio completa ahora corre en CI.
      # Antes solo se validaba HTML y el deploy salía sin ejecutar la suite.
      - name: Tests unitarios (node --test)
        run: npm run test:unit

      # G025 (ADR-052 Ola 3): firestore.rules —el único firewall del backend—
      # ahora se testea con el emulador de Firestore (requiere Java + firebase-tools).
      - name: Setup Java (emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar firebase-tools
        run: npm install -g firebase-tools

      - name: Tests de reglas Firestore (emulador)
        run: npm run test:rules
