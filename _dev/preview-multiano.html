<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEV · Multi-año por prueba (año global + fase por gráfica)</title>
<link rel="stylesheet" href="../assets/css/aqua-tokens.css">
<link rel="stylesheet" href="../assets/css/aqua-components.css">
<link rel="stylesheet" href="../assets/css/pruebas-electricas.css">
<style> body { padding: 24px; background: #f1f5f9; font-family: system-ui, sans-serif; } </style>
</head>
<body>
<h1>DEV · Multi-año (conserva fases · color por año · filtro año global + fase por gráfica)</h1>
<div id="pe-consolidado"></div>

<script type="module">
import { svgBloque } from '../assets/js/ui/pruebas/grafico-generico.js';
import { bloquesMultiAno } from '../assets/js/domain/pruebas_electricas_bloques.js';

// Mock REALISTA: 3 informes (2019/2021/2023) con bloques por fase (como la IA).
const tap = (base, n, step, drift) => Array.from({ length: n }, (_, i) => ({ x: i + 1, y: +(base + i * step + drift).toFixed(3) }));
const excit = (d) => ({ prueba: 'excitacion', titulo: 'Corriente de excitación', unidad: 'mA', eje_x: 'Posición del TAP', grafica: 'linea', limite: 30,
  series: [{ nombre: 'Fase A', puntos: tap(18, 9, 0.5, d) }, { nombre: 'Fase B', puntos: tap(11, 9, 0.5, d) }, { nombre: 'Fase C', puntos: tap(18.5, 9, 0.5, d) }] });
// Relación: desviaciones PEQUEÑAS, casi todas BAJO el límite 0.5% (cumplen).
const relac = (d) => ({ prueba: 'relacion', titulo: 'Relación de transformación · desviación', unidad: '%', eje_x: 'Posición del TAP', grafica: 'linea', limite: 0.5, guia: 0.3,
  series: [{ nombre: 'Fase A', puntos: tap(0.12, 9, 0.01, d) }, { nombre: 'Fase B', puntos: tap(0.10, 9, 0.012, d) }, { nombre: 'Fase C', puntos: tap(0.15, 9, 0.008, d) }] });
const aisla = (d) => ({ prueba: 'aislamiento', titulo: 'Resistencia de aislamiento', unidad: 'GΩ', eje_x: 'Configuración', grafica: 'barra', limite: 30,
  series: [{ nombre: 'CH', puntos: [{ x: 'AT-T', y: 42 - d }, { x: 'MT-T', y: 38 - d }] }] });

// 7 informes (como la serie 450108). OJO: dos comparten año 2021 (fechas distintas)
// → reproduce el bug de "no se aprecian todos" al agrupar por año.
const informes = [
  { ano: 2017, fecha: '10/03/2017', bloques: [excit(-0.4), relac(-0.02), aisla(-2)] },
  { ano: 2018, fecha: '05/06/2018', bloques: [excit(-0.1), relac(0.0), aisla(-1)] },
  { ano: 2019, fecha: '12/05/2019', bloques: [excit(0), relac(0.0), aisla(0)] },
  { ano: 2021, fecha: '18/01/2021', bloques: [excit(0.6), relac(0.04), aisla(3)] },
  { ano: 2021, fecha: '20/09/2021', bloques: [excit(0.7), relac(0.05), aisla(3.5)] },
  { ano: 2022, fecha: '14/07/2022', bloques: [excit(1.0), relac(0.06), aisla(5)] },
  { ano: 2023, fecha: '09/11/2023', bloques: [excit(1.4), relac(0.09), aisla(7)] }
];

// ── replica de montarMultiAno (shell, por INFORME) para validar el render ──
const COLORES_ANO = ['#1d4ed8', '#0d9488', '#dc2626', '#7c3aed', '#ea580c', '#0891b2', '#65a30d', '#db2777', '#0f766e', '#9333ea'];
const cont = document.getElementById('pe-consolidado');
const bloques = bloquesMultiAno(informes.map(i => ({ ...i, id: i.id || i.fecha })));
const repInfo = new Map();
for (const b of bloques) for (const s of b.series) if (!repInfo.has(s._rep)) repInfo.set(s._rep, { label: s._repLabel, ano: s._ano });
const repsAll = [...repInfo.keys()].sort((a, c) => (Number(repInfo.get(a).ano) || 0) - (Number(repInfo.get(c).ano) || 0) || String(repInfo.get(a).label).localeCompare(String(repInfo.get(c).label)));
const colorRep = (r) => COLORES_ANO[Math.max(0, repsAll.indexOf(r)) % COLORES_ANO.length];
const selR = new Set(repsAll);

cont.innerHTML = '';
const gbar = document.createElement('div'); gbar.className = 'pe-fase-chips';
gbar.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px';
gbar.appendChild(Object.assign(document.createElement('span'), { textContent: 'Informes (' + repsAll.length + '):', style: 'font-size:12px;color:#475569' }));
const host = document.createElement('div');
const pintarTodo = () => {
  host.innerHTML = '';
  for (const b of bloques) {
    const fases = [...new Set(b.series.map((s) => s._fase).filter(Boolean))];
    if (!b._selF) b._selF = new Set(fases);
    const selF = b._selF;
    const wrap = document.createElement('div'); wrap.className = 'pe-bloque-grupo';
    wrap.appendChild(Object.assign(document.createElement('h3'), { textContent: b.titulo }));
    const chartBox = document.createElement('div'); chartBox.className = 'chartbox';
    const repintar = () => {
      chartBox.innerHTML = '';
      const series = b.series.filter((s) => selR.has(s._rep) && (!fases.length || selF.has(s._fase))).map((s) => ({ ...s, color: colorRep(s._rep) }));
      const svg = series.length ? svgBloque({ ...b, series }) : null;
      if (svg) chartBox.appendChild(svg); else chartBox.innerHTML = '<p class="muted small">Sin series.</p>';
    };
    if (fases.length > 1) {
      const fbar = document.createElement('div'); fbar.className = 'pe-fase-chips';
      fbar.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 6px';
      fbar.appendChild(Object.assign(document.createElement('span'), { textContent: 'Fases:', style: 'font-size:12px;color:#475569' }));
      fases.forEach((f) => { const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pe-fase-chip' + (selF.has(f) ? ' is-on' : ''); btn.textContent = f;
        btn.addEventListener('click', () => { if (selF.has(f)) { if (selF.size > 1) selF.delete(f); } else selF.add(f); btn.classList.toggle('is-on', selF.has(f)); repintar(); }); fbar.appendChild(btn); });
      wrap.appendChild(fbar);
    }
    wrap.appendChild(chartBox); host.appendChild(wrap); repintar();
  }
};
repsAll.forEach((r) => { const info = repInfo.get(r); const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pe-fase-chip' + (selR.has(r) ? ' is-on' : ''); btn.textContent = info.label; btn.style.setProperty('--c', colorRep(r));
  btn.addEventListener('click', () => { if (selR.has(r)) { if (selR.size > 1) selR.delete(r); } else selR.add(r); btn.classList.toggle('is-on', selR.has(r)); pintarTodo(); }); gbar.appendChild(btn); });
cont.appendChild(gbar); cont.appendChild(host); pintarTodo();
window.__ready = true;
</script>
</body>
</html>
