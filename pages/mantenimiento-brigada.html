<main class="app-main page-container">

  <div class="page-header">
    <div class="breadcrumb">Operación / Mantenimiento Brigada</div>
    <h1 class="page-title">Mantenimiento <em>Brigada</em></h1>
    <p class="page-subtitle">

      IEC 60076.

      <div role="tabpanel" data-tab-panel="refrigeracion">

      </div>
      <div role="tabpanel" data-tab-panel="consolidado">
        <iframe class="tab-iframe" data-src="consolidado-refrigeracion.html" title="Consolidado de acciones de mantenimiento del sistema de refrigeración" loading="lazy"></iframe>
      </div>
    </div>
  </div>
